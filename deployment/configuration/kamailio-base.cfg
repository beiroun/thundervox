# Load modules
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

# Parameters
modparam("usrloc", "db_mode", 0)   # Use in-memory location
modparam("registrar", "method_filtering", 0)

# Main request routing logic
route {
    if (method=="REGISTER") {
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    if (method=="INVITE") {
        if (!lookup("location")) {
            sl_send_reply("404", "Not Found");
            exit;
        }
        route(RELAY);
        exit;
    }

    route[RELAY] {
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }
}
