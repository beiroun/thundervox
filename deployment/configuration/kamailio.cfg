#!KAMAILIO

### Загрузка модулей ###
loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "pv.so"
loadmodule "registrar.so"
loadmodule "rtpproxy.so"
loadmodule "nathelper.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "http_client.so"
loadmodule "dialog.so"
loadmodule "siputils.so"



### Настройки модулей ###
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "nat_bflag", 6)

modparam("dialog", "default_timeout", 100)

modparam("registrar", "method_filtering", 0)
modparam("registrar", "received_avp", "$avp(rcv)")

modparam("rtpproxy", "rtpproxy_sock", "udp:127.0.0.1:22222")

modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "sipping_method", "OPTIONS")
modparam("nathelper", "received_avp", "$avp(rcv)")


log_stderror=yes
debug=2


### Основной маршрут ###
route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (nat_uac_test("19")) {
        # если клиент за NAT, запоминаем
        if (method == "REGISTER") {
            fix_nated_register();
            setbflag(6);  # SIP ping будет идти только к NAT-абонентам
        } else {
            fix_nated_contact();
        }
    }

    if (method == "REGISTER") {
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    if (method == "INVITE") {
    xlog("L_INFO", "[THUNDERVOX] Time: [$Tf] Start INVITE for ip $si\n");
        if (!has_totag() && $si == "178.74.67.30") {
            $var(ci) = $ci;
            $var(ft) = $ft;
            $var(push_sent) = dlg_get_var("$var(ci)", "$var(ft)", "", "push_sent", "$var(pushed)");

            xlog("L_INFO", "[THUNDERVOX] Call-ID: $var(ci), From-tag: $var(ft), To-tag: $var(tt), Push sent: $var(push_sent)\n");

            if ($var(push_sent) != 2) {
                $var(hdrs) = "User-Agent: Modus Asterisk Server Client\r\nX-SERVICE-TOKEN: 4c5f9d5c-1aaa-49be-8c2f-1541b3078155\r\nContent-Type: application/json";
                $var(to) = "1001";
                $var(from) = "modus-services.ru:8082";
                $var(sip_ip) = "188.225.72.135";
                $var(call_id) = $ci;
                $var(body) = "{\"to\":\"" + $var(to) + "\",\"from\":\"" + $var(from) + "\",\"sip_ip\":\"" + $var(sip_ip) + "\",\"call_id\":\"" + $var(call_id) + "\"}";
                $var(resp) = "";
                xlog("L_INFO", "[THUNDERVOX] Time: [$Tf] Will send push with body: $var(body)\n");
                http_client_request("POST", "http://testapi.modus-omsk.ru:8081/api/sip/test", "$var(body)", "$var(hdrs)", "$var(resp)");
                xlog("L_INFO", "[THUNDERVOX] Time: [$Tf] Push sent: $var(resp)\n");
                dlg_set_var("$var(ci)", "$var(ft)", "", "push_sent", "2");
            }
        }
        dlg_manage();
        record_route();

        if (!lookup("location")) {
            sl_send_reply("404", "User Not Found");
            exit;
        }

        if (isflagset(6)) {
            rtpproxy_offer("ro");  # NAT клиент — через RTPProxy
        }


        route(RELAY);
        exit;
    }


    if (method == "ACK") {
        # ACK не содержит SDP — не трогаем
        exit;
    }

    if (method == "BYE" || method == "CANCEL") {
        rtpproxy_destroy("o");
        route(RELAY);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
    exit;
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
