#!KAMAILIO
#
# ThunderVox — SIP core (push-wait relay)
# =======================================
# A thin Kamailio proxy + registrar for physical SIP endpoints (intercoms,
# elevators, gates, SOS points) that call mobile apps which are NOT continuously
# registered. Media is relayed by rtpengine; user location is in-memory (no DB).
#
# The whole product hinges on one flow — "push-wait":
#   1. An always-registered endpoint (hardware) sends INVITE to a mobile AoR.
#   2. The app is asleep and NOT in the location table.
#   3. We PARK the INVITE transaction (tsilo module), keyed by the callee AoR,
#      reply 180 Ringing to the caller, and fire a push to wake the device.
#   4. The woken app REGISTERs -> tsilo resumes the parked INVITE and routes it
#      to the freshly-registered contact.
#   5. rtpengine anchors audio/video and fixes NAT on both legs.
# If the callee is already registered (e.g. a Zoiper softphone in testing),
# steps 3-4 are skipped and the INVITE is relayed immediately.
#
# NAT strategy (proven Kamailio pattern): the "received" method for registered
# devices (fix_nated_register + received_avp) and the "alias" method for the
# other in-dialog party (set_contact_alias / handle_ruri_alias).


####### Site-local values (kept OUT of this repository) #######
# Public IP, push gateway URL and the service token are deployment-specific and
# must never be committed. They live in local.cfg next to this file: copy
# local.cfg.example, fill it in, and docker-compose mounts it into the container.
# include_file is a preprocessor directive, so the substdef definitions it brings
# in are in effect for the whole config below, exactly as if written here.
#   TVX_PUBLIC_IP  - server public IP, MUST equal TVX_PUBLIC_IP in deployment/.env
#   TVX_PUSH_URL   - push gateway endpoint that wakes the callee device
#   TVX_PUSH_TOKEN - X-SERVICE-TOKEN value, MUST equal SERVICE_TV_SIP_TOKEN on the backend
include_file "/etc/kamailio/local.cfg"

# rtpengine ng control socket and per-leg media flags (plain RTP/AVP, no ICE).
#!define TVX_RTPENGINE_SOCK "udp:127.0.0.1:4444"
#!define TVX_RTP_FLAGS "replace-origin replace-session-connection ICE=remove"

# Flags. Keep the #!define lines bare: the preprocessor takes the whole rest of
# the line as the value, so a trailing "# comment" gets pasted into every usage
# and comments out the remainder of that statement (parse error one line later).
#   FLT_NATS - transaction flag: this call leg is behind NAT
#   FLB_NATB - branch flag: contact is NATed (stored in usrloc, natping target)
#!define FLT_NATS 5
#!define FLB_NATB 6


####### Global Parameters #######

debug=2
log_stderror=yes

memdbg=5
memlog=5

children=4

# Bind on all interfaces, advertise the public IP so replies/in-dialog come back
# to us even behind cloud NAT.
listen=udp:0.0.0.0:5060 advertise TVX_PUBLIC_IP:5060


####### Modules #######

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "kex.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "tsilo.so"
loadmodule "http_client.so"


####### Module Parameters #######

# --- registrar / usrloc: in-memory location ---
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "nat_bflag", FLB_NATB)                 # NATed contacts get pinged by nathelper
modparam("registrar", "method_filtering", 1)
modparam("registrar", "received_avp", "$avp(RECEIVED)")   # remember the real source socket of NATed UAs

# --- nathelper: NAT keepalive + received handling ---
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "natping_interval", 30)             # keep the NAT pinhole open every 30s
modparam("nathelper", "ping_nated_only", 1)

# --- rtpengine: media relay ---
modparam("rtpengine", "rtpengine_sock", TVX_RTPENGINE_SOCK)

# --- tsilo: park INVITE transactions until the callee registers ---
modparam("tsilo", "use_domain", 0)                        # match parked calls by username only (IP vs host safe)

# --- http_client: push gateway calls ---
modparam("http_client", "connection_timeout", 2)          # bound the blocking push call (see route[PUSH])


####### Main request routing #######

request_route {

    # basic sanity + hop limit
    route(REQINIT);

    # NAT detection (force_rport + contact fixups) for every request
    route(NATDETECT);

    # CANCEL: cancel the matching INVITE transaction (works for parked ones too)
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    # in-dialog (sequential) requests: ACK / BYE / re-INVITE
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # initial requests we serve
    if (is_method("REGISTER")) { route(REGISTER); exit; }
    if (is_method("INVITE"))   { route(INVITE);   exit; }

    # closed relay: no other initial request is accepted
    # (TODO §sec: authenticate/ACL who may originate calls before going public)
    sl_send_reply("405", "Method Not Allowed");
    exit;
}


# Request sanity and loop protection.
route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "[TVX] malformed request from $si:$sp — dropped\n");
        exit;
    }
}


# Detect NAT and rewrite contacts so we can reach UAs behind NAT.
route[NATDETECT] {
    force_rport();
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            # rewrite the REGISTER Contact to the real source (kept via received_avp)
            fix_nated_register();
        } else if (is_first_hop()) {
            # encode the real source into an alias so in-dialog requests get back to the UA
            set_contact_alias();
        }
        setflag(FLT_NATS);
    }
}


# REGISTER: store the contact, then resume any calls parked for this AoR.
route[REGISTER] {
    if (isflagset(FLT_NATS)) {
        setbflag(FLB_NATB);            # mark contact NATed so usrloc/nathelper keeps its pinhole alive
    }

    if (!save("location")) {
        sl_reply_error();
        exit;
    }
    xlog("L_INFO", "[TVX] REGISTER ok: aor=$tu contact=$ct src=$si:$sp\n");

    # The device just came online. If an endpoint called it while it slept, tsilo
    # appends the fresh contact as a branch and routes the parked INVITE now.
    ts_append("location", "$tu");
    exit;
}


# INVITE: anchor media, then relay (callee online) or park + push (callee offline).
route[INVITE] {
    # Record-Route so in-dialog ACK/BYE traverse us (needed for NAT + media teardown).
    record_route();

    # Attach reply/failure handling BEFORE any transaction is created — so a PARKED
    # transaction also runs these routes when tsilo later resumes it.
    t_on_reply("MANAGE_REPLY");
    t_on_failure("MANAGE_FAILURE");

    # Media offer: rewrite SDP so RTP is anchored on the relay (symmetric, NAT-safe).
    if (!rtpengine_manage(TVX_RTP_FLAGS)) {
        xlog("L_ERR", "[TVX] rtpengine offer FAILED for INVITE $fU -> $rU\n");
        sl_send_reply("500", "Media Error");
        exit;
    }

    if (lookup("location")) {
        # Callee registered -> relay immediately.
        xlog("L_INFO", "[TVX] INVITE $fU -> $rU: callee ONLINE, relaying\n");
        route(RELAY);
        exit;
    }

    # Callee offline -> park the transaction (push-wait) and wake the device.
    xlog("L_INFO", "[TVX] INVITE $fU -> $rU: callee OFFLINE, parking + push\n");
    if (!t_newtran()) {
        sl_reply_error();
        exit;
    }
    ts_store();                        # park this transaction, keyed by R-URI (the callee AoR)
    t_reply("180", "Ringing");         # keep the caller ringing while the device wakes up
    route(PUSH);                       # fire the push to wake the callee's device
    exit;
}


# Wake the callee device via the push gateway.
#
# POINT OF FAILURE (read this): http_client_request is SYNCHRONOUS — it blocks this
# SIP worker until the gateway answers or connection_timeout (2s) elapses. A hung
# gateway therefore ties up one worker. For production, move push delivery to an
# async gateway microservice and fire-and-forget here (target architecture §2А).
route[PUSH] {
    # tv-sip backend contract: call_id correlates all further actions on this call,
    # caller_id is the calling device id (its source ip:port — the same value the
    # mobile backend uses as intercom device_id), callee_id is the client to wake.
    $var(body) = "{\"call_id\":\"" + $ci + "\",\"caller_id\":\"" + $si + ":" + $sp + "\",\"callee_id\":\"" + $rU + "\"}";
    $var(hdrs) = "X-SERVICE-TOKEN: TVX_PUSH_TOKEN\r\nContent-Type: application/json\r\n";

    xlog("L_INFO", "[TVX] push wake -> callee=$rU caller=$si:$sp call_id=$ci url=TVX_PUSH_URL\n");

    if (http_client_request("POST", "TVX_PUSH_URL", "$var(body)", "$var(hdrs)", "$var(push_resp)")) {
        # The test backend echoes the parsed fields back — field-mapping mistakes
        # are visible right here in resp.
        xlog("L_INFO", "[TVX] push accepted: callee=$rU resp=$var(push_resp)\n");
    } else {
        # Data-loss point: device may never wake -> caller rings until timeout.
        xlog("L_WARN", "[TVX] push FAILED: callee=$rU call_id=$ci — device may not wake\n");
    }
}


# In-dialog requests: route by the Route set, manage media on teardown.
route[WITHINDLG] {
    if (loose_route()) {
        # decode the alias (if any) so NATed in-dialog requests reach the real UA
        handle_ruri_alias();

        if (is_method("BYE")) {
            xlog("L_INFO", "[TVX] BYE $fU -> $rU: releasing media\n");
            rtpengine_manage();                 # tear down the rtpengine session
        } else if (is_method("ACK")) {
            rtpengine_manage(TVX_RTP_FLAGS);    # keep media anchored for the 2xx ACK
        } else if (is_method("INVITE")) {
            rtpengine_manage(TVX_RTP_FLAGS);    # re-INVITE (hold/resume/media change)
        }

        route(RELAY);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) {
            # ACK to a locally generated non-2xx reply -> absorbed by tm
            route(RELAY);
            exit;
        }
        # stray ACK with no matching transaction -> ignore
        exit;
    }

    sl_send_reply("404", "Not Here");
    exit;
}


# Relay with the correct reply/failure routes attached.
route[RELAY] {
    if (is_method("INVITE")) {
        if (!t_is_set("onreply_route")) t_on_reply("MANAGE_REPLY");
        if (!t_is_set("failure_route")) t_on_failure("MANAGE_FAILURE");
    }
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}


# Reply handler: process the callee's SDP answer and remember its NAT alias.
onreply_route[MANAGE_REPLY] {
    # 18x early media or 2xx answer carrying SDP -> hand it to the relay (answer side).
    if ($rs >= 180 && $rs < 300) {
        if (has_body("application/sdp")) {
            rtpengine_manage(TVX_RTP_FLAGS);
        }
    }
    # If the callee is NATed, alias its Contact so the caller's in-dialog reaches it.
    if (nat_uac_test("1")) {
        set_contact_alias();
    }
}


# Failure handler: release media when the call could not be completed.
failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }
    xlog("L_INFO", "[TVX] call FAILED: $fU -> $rU code=$T_reply_code — releasing media\n");
    rtpengine_manage();
}
