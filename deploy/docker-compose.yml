# ThunderVox - the whole system on one host
# ==========================================
# This directory is the only thing that lives on the server: this file, the Caddyfile, .env (from .env.example)
# and the two core config files local.cfg / tls.cfg (their templates ship inside the core image:
# docker compose run --rm --entrypoint cat core /etc/kamailio/local.cfg.example). No component sources, no
# builds on the host - every service is a published image, pinned to the version it was tested with. Updating a
# component = bump its tag here -> commit -> on the server `git pull && docker compose pull && docker compose up -d`.
#
# Secrets never enter this repository: passwords and host names live in .env, TLS private keys are written by
# the edge proxy into ./edge-data on the host. Both are gitignored; this file only names them.
#
# Every service runs with network_mode: host: one host, no bridge NAT, 127.0.0.1 means the same thing for all of
# them. Only SIP, RTP and HTTP face the internet; the database, the server API and the rtpengine control socket
# listen on loopback.
#
# Profiles - chosen by COMPOSE_PROFILES in .env, so a manual `docker compose up -d` and thundervox.service (the
# system service, RUNBOOK.md) start the same set:
#   (none)         core + rtpengine - the bare SIP core, as tested on the stand (TVX_PROVISIONING off)
#   provisioning   + postgres + server + web + edge - the provisioning layer (accounts, auth, console)
#   tls            edge alone - when only the SIP core needs a certificate (TVX_TLS without the console)
#
# Config check of the core before (re)starting it - fails fast on a typo in local.cfg:
#   docker compose run --rm core -c -f /etc/kamailio/kamailio.cfg
#
# Firewall: UDP+TCP 5060 (SIP), UDP 29000-30000 (RTP), TCP 5061 (SIPS, with TVX_TLS), TCP 80 + 443 (edge; 80
# is required even for an HTTPS-only site - the ACME challenge and the redirect to HTTPS both use it).

# Pinned project name. Without it Compose takes the directory name ("deploy"), and the database volume is named
# after it: a checkout under another directory name would start Postgres on a new, empty volume.
name: thundervox

services:
  core:
    image: ghcr.io/beiroun/thundervox-core:0.10.0
    container_name: thundervox-core
    network_mode: host
    # Long syntax with create_host_path: false on every host path. The short form creates a missing source as an
    # empty root-owned directory: a missing tls.cfg became a directory on the first host (the tls module then
    # fails with "cannot make tmp file" once TVX_TLS is on), a missing edge-data a directory Caddy cannot write.
    # Without host path creation a missing file fails `up`/`run` at once with "bind source path does not exist".
    volumes:
      # Only the site-local files are mounted; kamailio.cfg is part of the image. A missing local.cfg fails the
      # start on purpose instead of running with somebody else's defaults.
      - type: bind
        source: ./local.cfg
        target: /etc/kamailio/local.cfg
        read_only: true
        bind:
          create_host_path: false
      # TLS profiles, read only when local.cfg defines TVX_TLS. The file has to exist either way.
      - type: bind
        source: ./tls.cfg
        target: /etc/kamailio/tls.cfg
        read_only: true
        bind:
          create_host_path: false
      # Certificates obtained by the edge proxy. The core runs as uid 1001, the same uid the edge container is
      # given, because CertMagic keeps private keys at 0600 - a shared group would not be enough.
      - type: bind
        source: ./edge-data
        target: /tls
        read_only: true
        bind:
          create_host_path: false
    environment:
      TZ: "Asia/Omsk"
    depends_on:
      - rtpengine            # ordering only; the core retries the ng socket at runtime
    restart: always

  rtpengine:
    image: ghcr.io/beiroun/thundervox-rtpengine:0.10.0
    container_name: thundervox-rtpengine
    network_mode: host
    environment:
      # fails fast if .env is missing instead of advertising media on a bogus address
      TVX_PUBLIC_IP: "${TVX_PUBLIC_IP:?set TVX_PUBLIC_IP in deploy/.env}"
      TVX_LOCAL_IP: "${TVX_LOCAL_IP:-}"       # only when the host's interface address differs from the public one (1:1 NAT)
      TVX_RTP_NG_PORT: "4444"                 # ng control port on 127.0.0.1; the core's TVX_RTPENGINE_SOCK points here
      TVX_RTP_PORT_MIN: "29000"               # narrow test pool (~250 concurrent calls); widen for production
      TVX_RTP_PORT_MAX: "30000"
      TVX_RTP_LOG_LEVEL: "${TVX_RTP_LOG_LEVEL:-6}"   # 6=info; 7 for verbose media debug
      TZ: "Asia/Omsk"
    restart: always

  postgres:
    image: postgres:18
    container_name: thundervox-postgres
    profiles: ["provisioning"]
    network_mode: host
    # Host networking: the database is for the core and the server on this host only, so bind to loopback
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: thundervox
      POSTGRES_USER: thundervox              # schema owner; the server runs Flyway as this superuser (needs CREATEROLE)
      POSTGRES_PASSWORD: "${TVX_DB_PASSWORD:-}"    # empty -> the image refuses to initialise, which is the right failure
      TZ: "Asia/Omsk"
    volumes:
      # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker; the parent is what the image declares as the volume
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U thundervox -d thundervox"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: always

  server:
    image: ghcr.io/beiroun/thundervox-server:0.5.0
    container_name: thundervox-server
    profiles: ["provisioning"]
    network_mode: host
    environment:
      TVX_DB_URL: "jdbc:postgresql://127.0.0.1:5432/thundervox"
      TVX_DB_USER: "thundervox"
      TVX_DB_PASSWORD: "${TVX_DB_PASSWORD:-}"
      TVX_SIP_DB_PASSWORD: "${TVX_SIP_DB_PASSWORD:-}"   # role the core logs in with; the same value goes into local.cfg TVX_DB_URL
      TVX_SERVER_BIND: "127.0.0.1"           # reached by the console's nginx (/api) and by the edge proxy
      TVX_SERVER_PORT: "8080"
      # Browser origins allowed to call the API cross-site. The console is same-origin through its own nginx,
      # so this is only for a browser on another name (console host calling the server host directly, Swagger
      # UI on the server's name). Empty = no cross-site browser access.
      TVX_CORS_ORIGINS: "${TVX_CORS_ORIGINS:-}"
      TVX_LOG_LEVEL: "${TVX_LOG_LEVEL:-INFO}"
      # Digest realm of every issued SIP password = the SIP name devices register to (the core's TVX_SIP_DOMAIN).
      # Hashed into each stored HA1: a different name later makes every issued password useless.
      TVX_SIP_REALM: "${TVX_SIP_HOST:-}"
      # Console access: token signing key and the super administrator (empty -> the server refuses to start)
      TVX_JWT_SECRET: "${TVX_JWT_SECRET:-}"
      TVX_SUPERADMIN_LOGIN: "${TVX_SUPERADMIN_LOGIN:-}"
      TVX_SUPERADMIN_PASSWORD: "${TVX_SUPERADMIN_PASSWORD:-}"
      TVX_CONSOLE_TOKEN_TTL: "${TVX_CONSOLE_TOKEN_TTL:-PT8H}"
      # Shared secret of the operator's backend for /service/** (header X-SERVICE-TOKEN). Empty = service API off.
      TVX_SERVICE_TOKEN: "${TVX_SERVICE_TOKEN:-}"
      # Same zone as the core: the console compares the registration expiry the core writes with the server clock
      TZ: "Asia/Omsk"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  web:
    image: ghcr.io/beiroun/thundervox-web:0.6.0
    container_name: thundervox-web
    profiles: ["provisioning"]
    network_mode: host                       # nginx on 127.0.0.1:8081 behind the edge, proxies /api to 127.0.0.1:8080
    environment:
      TZ: "Asia/Omsk"
    depends_on:
      - server
    restart: always

  edge:
    # Caddy obtains and renews the certificates itself (ACME HTTP-01) - no certbot, no cron, no reload hook.
    image: caddy:2.11.6
    container_name: thundervox-edge
    # Two ways in: with the provisioning layer (it serves the console and the API) and on its own, when only
    # the SIP core needs a certificate.
    profiles: ["provisioning", "tls"]
    network_mode: host
    # The core reads the SIP certificate this container writes, and CertMagic keeps private keys at 0600, so
    # both have to be the same uid - 1001 is pinned in the core image for exactly this reason.
    user: "1001:1001"
    cap_add:
      # The image's binary carries cap_net_bind_service, but a non-root uid still has to be granted it to
      # listen on 80 and 443.
      - NET_BIND_SERVICE
    environment:
      # Site names; the Caddyfile substitutes them into its site addresses at parse time
      TVX_CONSOLE_HOST: "${TVX_CONSOLE_HOST:?set TVX_CONSOLE_HOST in deploy/.env}"
      TVX_SERVER_HOST: "${TVX_SERVER_HOST:?set TVX_SERVER_HOST in deploy/.env}"
      TVX_SIP_HOST: "${TVX_SIP_HOST:?set TVX_SIP_HOST in deploy/.env}"
      TVX_ACME_EMAIL: "${TVX_ACME_EMAIL:?set TVX_ACME_EMAIL in deploy/.env}"
      # Keeps Caddy's autosaved config inside the same mounted directory, so the container needs one writable
      # path and not two
      XDG_CONFIG_HOME: "/data/config"
      TZ: "Asia/Omsk"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates, keys and the ACME account. A bind mount on purpose: the directory is created and chowned
      # to 1001 by the runbook before the first start, which a named volume cannot express.
      - type: bind
        source: ./edge-data
        target: /data
        bind:
          create_host_path: false
    restart: always

volumes:
  postgres-data:
